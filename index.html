<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Uppgift 4</title>
    <link rel='stylesheet' href='main.css'>

</head>
<body>

<h1>ToDo list</h1>
<h2>Current Tasks:</h2>

<ul id="list">
<!-- Task list will be populated here by JavaScript -->
</ul>

<p>Click on a task to mark it as finished.</p>

<label for="input-field">New Task:</label>
<br>
<input type="text" id="input-field" placeholder="Add a new task...">
<button class="addBtn">Add to list</button>
<small id="empty-input-message" class="message"></small>

<p id="taskCounter">0 tasks completed</p>

</body>
<script src="code.js"></script>
</html>
